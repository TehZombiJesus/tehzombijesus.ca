# Announce updates in the Discord server when they reach the live site.
# New devlog posts go to the devlog channel; the list of changes can go to a changelog channel.
# Needs the secrets DISCORD_DEVLOG_WEBHOOK (and optionally DISCORD_CHANGELOG_WEBHOOK): see the README.
name: Announce on Discord

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slug:
        description: "Post one devlog entry again (its slug, for example a-new-look)"
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Cloudflare to publish the site
        if: github.event_name == 'push'
        run: sleep 90
      - name: Post to Discord
        env:
          DISCORD_DEVLOG_WEBHOOK: ${{ secrets.DISCORD_DEVLOG_WEBHOOK }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
          COMMITS: ${{ toJson(github.event.commits) }}
          SLUG: ${{ github.event.inputs.slug }}
        run: python3 tools/discord_post.py
