# Publishes a GitHub release whenever the version number goes up.
# Bump the version (VERSION), add its section to CHANGELOG.md, push to main: this workflow tags the
# commit (v1.2.0) and publishes the release with that CHANGELOG section as its notes. Nothing else to do.
name: Release

on:
  push:
    branches: [main]
    paths: ['VERSION', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and publish the release (if this version doesn't have one yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released."; exit 0; fi
          # the CHANGELOG section for this version, up to the next "## v"
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $TAG yet: not releasing."; exit 0; }
          printf '\nBuild `%s`\n' "${GITHUB_SHA::7}" >> notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG · build ${GITHUB_SHA::7}" --notes-file notes.md
