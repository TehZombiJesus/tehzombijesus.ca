# Turns every version tag (v1.2.0) into a GitHub release, with its notes taken from CHANGELOG.md.
# Tag a release with:  git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the CHANGELOG section for this version, up to the next "## v"
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\nBuild `%s`\n' "${GITHUB_SHA::7}" >> notes.md
          gh release create "$TAG" --title "$TAG · build ${GITHUB_SHA::7}" --notes-file notes.md --verify-tag
